services:
  mongo:
    image: mongo:7
    container_name: practice-08-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # Учебные учётные данные для локального контейнера из методички.
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
